    ".cargo/**",
    ".config/**",
    "Cargo.lock",
    "src/anthropic.rs",
    "src/anthropic/**",
    "src/core/lessons.rs",
    "src/core/lessons/**",
    "src/core/budget.rs",
    "src/core/budget/**",
    "src/sessions/**",
    "src/gates/**",
