# Risk rules (spec §8). risk-check reads this file from the PR's base branch, never from the
# head, so a PR cannot change the rules that judge it. A rule only escalates.

[[rule]]
id = "R-gov"
why = "Governance files decide who approves what."
# REVIEW.md and docs/lessons.toml are read into every review pack; docs/setup-script.sh runs
# as root wherever it is pasted. **/plans/** carry `allow:` and touch lists for test-integrity and
# claims (spec §8).
paths = [
    ".bosun/**", "governance/**", "CODEOWNERS", "docs/CODEOWNERS", ".github/CODEOWNERS", "**/codeowners", ".claude/**", "**/.claude/**", ".splice/**", "**/hoist.toml", "docs/setup-script.sh", "REVIEW.md", "docs/lessons.toml", "src/core/session_rules.rs", "src/core/session_rules/**", "src/hooks/session_rules.rs", "src/hooks/session_rules/**", ".claude-plugin/**", "docs/agents/**", "**/agents.md", "**/claude.md", "**/claude.local.md", "**/plans/**",
    # Org decisions (D-002; D-022 names its own row as trust root).
    "decisions/**",
    # The repo setup `keel up` applies (with hoist.toml above).
    "keel.toml",
    # splice's own R-gov rule (its old .bosun/risk.toml), re-rooted under splice/.
    "splice/.bosun/**", "splice/governance/**", "splice/CODEOWNERS", "splice/docs/CODEOWNERS", "splice/.github/CODEOWNERS", "splice/.claude/**", "splice/.splice/**", "splice/docs/setup-script.sh", "splice/REVIEW.md", "splice/src/core/session_rules.rs", "splice/src/core/session_rules/**", "splice/src/hooks/session_rules.rs", "splice/src/hooks/session_rules/**", "splice/.claude-plugin/**", "splice/docs/agents/**",
    # hull's own R-gov rule (its old .bosun/risk.toml), re-rooted under hull/.
    "hull/.bosun/**", "hull/governance/**", "hull/CODEOWNERS", "hull/docs/CODEOWNERS", "hull/.github/CODEOWNERS", "hull/.claude/**", "hull/.splice/**", "hull/docs/setup-script.sh", "hull/REVIEW.md", "hull/src/core/session_rules.rs", "hull/src/core/session_rules/**", "hull/src/hooks/session_rules.rs", "hull/src/hooks/session_rules/**", "hull/.claude-plugin/**", "hull/docs/agents/**",
    # hoard's own R-gov rule (its old .bosun/risk.toml), re-rooted under hoard/.
    "hoard/.bosun/**", "hoard/governance/**", "hoard/CODEOWNERS", "hoard/docs/CODEOWNERS", "hoard/.github/CODEOWNERS", "hoard/.claude/**", "hoard/.splice/**", "hoard/docs/setup-script.sh", "hoard/REVIEW.md", "hoard/src/core/session_rules.rs", "hoard/src/core/session_rules/**", "hoard/src/hooks/session_rules.rs", "hoard/src/hooks/session_rules/**", "hoard/.claude-plugin/**", "hoard/docs/agents/**",
    # hoist's own R-gov rule (its old .bosun/risk.toml), re-rooted under hoist/.
    "hoist/.bosun/**", "hoist/governance/**", "hoist/CODEOWNERS", "hoist/docs/CODEOWNERS", "hoist/.github/CODEOWNERS", "hoist/.claude/**", "hoist/.splice/**", "hoist/docs/setup-script.sh", "hoist/REVIEW.md", "hoist/src/core/session_rules.rs", "hoist/src/core/session_rules/**", "hoist/src/hooks/session_rules.rs", "hoist/src/hooks/session_rules/**", "hoist/.claude-plugin/**", "hoist/docs/agents/**",
    # The site's governance paths (D-024), re-rooted under site/ like the folders above; the
    # site's copy of bosun's setup script is served for pasting and runs as root too.
    "site/.bosun/**", "site/governance/**", "site/CODEOWNERS", "site/docs/CODEOWNERS", "site/.github/CODEOWNERS", "site/.claude/**", "site/.splice/**", "site/docs/setup-script.sh", "site/REVIEW.md", "site/src/core/session_rules.rs", "site/src/core/session_rules/**", "site/src/hooks/session_rules.rs", "site/src/hooks/session_rules/**", "site/.claude-plugin/**", "site/docs/agents/**", "site/apps/site/src/data/bosun/setup-script.sh",
]

[[rule]]
id = "R-ci"
why = "CI decides what is verified."
# Owner (the default), not "delegate" as in bosun's one-repo file: splice, hull, hoard and hoist
# had no delegate in their repos, so their CI paths below stay owner-only (a monorepo never
# loosens a folder's old rule). One id per rule, so the same holds for bosun's paths here.
paths = [
    ".github/workflows/**", ".github/actions/**", ".github/dependabot.yml", "scripts/**", "Makefile", "**/Makefile", "justfile", "**/justfile", "Dockerfile", "**/Dockerfile", ".husky/**", "**/action.yml", "**/action.yaml", ".circleci/**", ".gitlab-ci.yml", ".gitlab/ci/**", ".buildkite/**", "**/jenkinsfile", "azure-pipelines.y*ml", "bitbucket-pipelines.yml", ".travis.yml", ".drone.yml", "**/deny.toml", "**/.deny.toml", "**/deny.exceptions.toml", "**/.deny.exceptions.toml", "**/deny.local.toml", "**/.deny.local.toml", "scripts/deny.mjs", "rust-toolchain.toml", "rust-toolchain", "**/rust-toolchain.toml", "**/rust-toolchain", "**/clippy.toml", "**/.clippy.toml", "**/rustfmt.toml", "**/.rustfmt.toml", "**/.cargo/config", "**/.cargo/config.toml",
    # affected.sh decides which folders CI builds and tests.
    ".github/scripts/**",
    # splice's own R-ci rule (its old .bosun/risk.toml), re-rooted under splice/.
    "splice/.github/workflows/**", "splice/.github/actions/**", "splice/.github/dependabot.yml", "splice/scripts/**", "splice/Makefile", "splice/justfile", "splice/Dockerfile", "splice/.husky/**", "splice/.circleci/**", "splice/.gitlab-ci.yml", "splice/.gitlab/ci/**", "splice/.buildkite/**", "splice/azure-pipelines.y*ml", "splice/bitbucket-pipelines.yml", "splice/.travis.yml", "splice/.drone.yml", "splice/rust-toolchain.toml",
    # hull's own R-ci rule (its old .bosun/risk.toml), re-rooted under hull/.
    "hull/.github/workflows/**", "hull/.github/actions/**", "hull/.github/dependabot.yml", "hull/scripts/**", "hull/Makefile", "hull/justfile", "hull/Dockerfile", "hull/.husky/**", "hull/.circleci/**", "hull/.gitlab-ci.yml", "hull/.gitlab/ci/**", "hull/.buildkite/**", "hull/azure-pipelines.y*ml", "hull/bitbucket-pipelines.yml", "hull/.travis.yml", "hull/.drone.yml", "hull/.npmrc",
    # hoard's own R-ci rule (its old .bosun/risk.toml), re-rooted under hoard/.
    "hoard/.github/workflows/**", "hoard/.github/actions/**", "hoard/.github/dependabot.yml", "hoard/scripts/**", "hoard/Makefile", "hoard/justfile", "hoard/Dockerfile", "hoard/.husky/**", "hoard/.circleci/**", "hoard/.gitlab-ci.yml", "hoard/.gitlab/ci/**", "hoard/.buildkite/**", "hoard/azure-pipelines.y*ml", "hoard/bitbucket-pipelines.yml", "hoard/.travis.yml", "hoard/.drone.yml", "hoard/rust-toolchain.toml", "hoard/.npmrc",
    # hoist's own R-ci rule (its old .bosun/risk.toml), re-rooted under hoist/.
    "hoist/.github/workflows/**", "hoist/.github/actions/**", "hoist/.github/dependabot.yml", "hoist/scripts/**", "hoist/Makefile", "hoist/justfile", "hoist/Dockerfile", "hoist/.husky/**", "hoist/.circleci/**", "hoist/.gitlab-ci.yml", "hoist/.gitlab/ci/**", "hoist/.buildkite/**", "hoist/azure-pipelines.y*ml", "hoist/bitbucket-pipelines.yml", "hoist/.travis.yml", "hoist/.drone.yml", "hoist/rust-toolchain.toml",
    # berth's imported workflows (inert in its folder, like the folders above): a copy back to
    # the root would run them.
    "berth/.github/workflows/**",
]

[[rule]]
id = "R-gate"
why = "The gate code decides what passes."
approval = "delegate"
# A file and its module directory: `x.rs` and `x/**`.
paths = [
    "src/core/risk.rs",
    "src/core/weaken.rs",
    "src/core/risk_default.toml",
    "src/core/verdict.rs",
    "src/core/verdict/**",
    "src/core/records.rs",
    "src/core/records/**",
    "src/core/meta.rs",
    "src/core/meta/**",
