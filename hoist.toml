# keelstack's repository setup (hoist spec §5). `keel up` (root keel.toml) applies it; every
# item of .github/SETUP.md is a hoist item or human step from this file plus inference
# (workflows, Cargo workspace, npm launchers).

[github]
# Each required check is pinned to the App that posts it (hoist spec §6.1, bosun spec §15 step 6):
# ci-ok aggregates the per-folder ci-* jobs of ci.yml (GitHub Actions, id 15368); risk-check,
# review-verdict and main-open are check runs of the bosun gate App ([checks] mode = "checks" in
# .bosun/bosun.toml). A status, or a check run from any other App, then satisfies none of them.
# The gate App's `bosun-ci-ok` run (signer.yml `mirror`, for the CI signer) is a different check.
required_checks = [
  { context = "ci-ok", integration_id = 15368 },
  { context = "risk-check", app = "keelstackhq-bosun-gate" },
  { context = "review-verdict", app = "keelstackhq-bosun-gate" },
  { context = "main-open", app = "keelstackhq-bosun-gate" },
]
# Off: risk-check, review-verdict and main-open never post on merge_group, so a merge queue
# would hold every PR (ci.yml still listens to merge_group, harmless).
merge_queue = false
allow_auto_merge = true
delete_branch_on_merge = true
# Every secret lives in the environment of the jobs that read it, never in the repository.
secret_scope = "environment"
# review.yml runs only when this is `true` (set with bosun `[review] mode = "ci"`); unset = off.
optional_variables = ["BOSUN_REVIEW_CI"]
# Needed only when BOSUN_REVIEW_CI is `true`.
optional_secrets = ["ANTHROPIC_API_KEY"]
# The bosun gate app posts risk-check, review-verdict and main-open.
apps = ["keelstackhq-bosun-gate"]

# Tags `v*` (`vX.Y.Z` and the major tag `v0` every `keelstackhq/keelstack/<tool>@v0` consumer
# runs): the only bypass actor of `hoist: tags` is the write deploy key `hoist: release tags`,
# not the GitHub Actions integration, so no workflow token (whatever its `contents:` scope) can
# create, move or delete a `v*` tag. `hoist apply` creates the key and seals its private key as
# the secret RELEASE_TAG_KEY of environment `release-tags` (default branch only, no reviewers);
# release.yml's job `release` pushes `vX.Y.Z` and `v0` over SSH with it. The key is not in
# `release`: that environment is the owner's tap and the registry job `publish` runs dependency
# code there, which must never run next to the key. `release-tags` has no reviewer by design:
# it deploys from main only (a workflow change there is an owner-approved .github change) and
# the tag job runs no dependency code; the owner's one tap is on `release`.
tags_bypass = "deploy_key"
tags_key_environment = "release-tags"
# The default-branch ruleset gets the repository-admin bypass in `pull_request` mode: only the
# owner's mainfix path (.github/SETUP.md, "Main does not build"). bosun merges with GITHUB_TOKEN,
# never an admin token, so the required checks stay enforced for its merges.
admin_bypass = true

[github.tag_ruleset]
patterns = ["v*"]

# Deployment branch: the default branch only (hoist's default), no reviewers (D-022).
[github.environments.bosun-app]
[github.environments.bosun-signer]
[github.environments.review]
[github.environments.hoard-r2]
[github.environments.site]
[github.environments.release-tags]

# Extra workspace members: the root is a Cargo workspace, not a pnpm one. The npm launchers
# (their platform packages are found next to them) and the landing site.
[workspace]
members = ["bosun/npm/bosun", "splice/npm/splice", "hoist/npm/hoist", "berth/npm/berth", "keel/npm/keel", "site"]

[release]
# One version for every tool (lockstep, D-023), one tag `vX.Y.Z`.
versioning = "fixed"
tag_format = "v{version}"
environment = "release"
# The workflow named in the trusted publishers (cargo-deny-npm.yml also uses `release`).
workflow = "release.yml"
# The owner taps `release` once per release (D-028): `hoist apply` sets this login as the
# environment's required reviewer, so a version-bump merge publishes only after the tap
# (release.yml's job `publish` is the only job in it; the tag job uses `release-tags`).
reviewers = ["urbanisierung"]

# splice's launcher and platform packages: release.yml publishes them (the platform packages
# are generated by splice/scripts/npm-stage.mjs, so they are no workspace members).
# splice is no crates.io crate (publish = false); release.yml generates its platform packages.
[registry.npm."@keelstackhq/splice"]
workflow = "release.yml"
[registry.npm."@keelstackhq/splice-linux-x64"]
workflow = "release.yml"
[registry.npm."@keelstackhq/splice-linux-arm64"]
workflow = "release.yml"
[registry.npm."@keelstackhq/splice-darwin-x64"]
workflow = "release.yml"
[registry.npm."@keelstackhq/splice-darwin-arm64"]
workflow = "release.yml"
[registry.npm."@keelstackhq/splice-win32-x64"]
workflow = "release.yml"

# npm packages published outside the lockstep release (their own workflow and version).
[registry.npm."@keelstackhq/cargo-deny"]
workflow = "cargo-deny-npm.yml"
[registry.npm."@keelstackhq/cargo-deny-linux-x64"]
workflow = "cargo-deny-npm.yml"
[registry.npm."@keelstackhq/cargo-deny-linux-arm64"]
workflow = "cargo-deny-npm.yml"
