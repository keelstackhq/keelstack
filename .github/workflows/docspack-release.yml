name: docspack-release

# Publishes the docs package @keelstackhq/docspack to npm when the version in
# apps/site/docspack.json is not on npm yet. Repo-local workflow (not owned by the hull template).
# npm trusted publishing (OIDC): no NPM_TOKEN; the publish job waits for the owner's approval of the
# `release` environment. It runs only on a push to main that changes docspack.json, or by hand, so
# pull requests cost no CI minutes. No dependency cache in the job that holds id-token.
# One-time owner setup: docs/agents/project.md, Blocked.

on:
  push:
    branches: [main]
    paths: [apps/site/docspack.json]
  workflow_dispatch:

concurrency:
  group: docspack-release
  cancel-in-progress: false

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      tarball: ${{ steps.check.outputs.tarball }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Is this version on npm yet?
        id: check
        run: |
          name=$(node -p "require('./apps/site/docspack.json').name")
          version=$(node -p "require('./apps/site/docspack.json').version")
          tarball="apps/site/dist/docspack/$(echo "${name#@}" | tr / -)-${version}.tgz"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          if out=$(npm view "${name}@${version}" version 2>&1); then
            echo "::notice::${name}@${version} is already on npm; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q E404; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::npm view ${name}@${version} failed: ${out}"
            exit 1
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - name: npm supports trusted publishing
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $v is too old for trusted publishing (needs 11.5.1 or later)"
            exit 1
          fi
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the site and the docs package
        run: pnpm --filter @keelstackhq/site build
      - name: Publish
        env:
          TARBALL: ${{ needs.check.outputs.tarball }}
        run: npm publish "$TARBALL" --access public
