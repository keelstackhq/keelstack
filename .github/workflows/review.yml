name: review

# Review mode (b), spec §7 and M8: `bosun review-ci` posts the required `review-verdict` status
# with no Claude session. It does nothing unless `.bosun/bosun.toml` on the base says
# `[review] mode = "ci"`; in mode (a) a session's verdict comment and verdict.yml set the status.
#
# pull_request_target runs this file from the base branch, so a PR cannot rewrite the job that
# reviews it. The job never checks out or runs PR-head code: it builds bosun from the workspace at
# the PR's base commit and reads the PR through the API; the diff reaches the model only as data.
# Event data reaches `run:` lines through `env:` only, never as `${{ }}` in a script.
#
# D-007: while the repo runs mode (a) (`subagent`), this job would build bosun on every push just
# to do nothing, so it runs only when the repository variable BOSUN_REVIEW_CI is `true`. Set it
# in the same change that sets `[review] mode = "ci"`.
# Config: bosun reads `<git top level>/.bosun/*` (ctx.rs, `git rev-parse --show-toplevel`): the
# monorepo's root .bosun/ of the checked-out commit (bosun.toml with [[folders]], risk.toml, ...).
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# A new head replaces the review of the old one.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege: statuses for the verdict; pull-requests and issues write for the findings
# comment, the verdict record and the task's state labels; read for the base files.
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  review:
    # Same-repo PRs by the repo's own people only: anyone else's PR would spend the API budget;
    # it is reviewed in a session.
    if: >-
      vars.BOSUN_REVIEW_CI == 'true' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)
    # Keep ANTHROPIC_API_KEY in this environment, limited to the main branch: a workflow on a
    # pushed branch then cannot read it (pull_request_target runs with the base ref).
    environment: review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # bosun is built from this workspace (never downloaded): the checkout above is the base
      # commit or the default branch, so the binary comes from reviewed code, never from the PR head.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      # No rust-cache here: this job holds a secret, and a cache another job could write must not
      # reach what it builds or runs.
      # No pinned-release fallback yet: no monorepo release exists, and the old keelstackhq/bosun
      # releases (<= 0.21.0, .bosun/version) cannot read [[folders]], so they would mis-judge. A
      # base whose bosun does not build fails this gate closed (.github/SETUP.md, "Main does not
      # build"); the fallback to the pinned release returns with the first monorepo release.
      - name: build bosun
        run: |
          if ! cargo build --release --locked -p keel-bosun --bin bosun; then
            echo "::error::bosun does not build at the base commit: this gate cannot judge and fails closed (no pinned-release fallback until the first monorepo release). Fix: a bosun:kind/mainfix PR that makes bosun build on main, merged by the owner past the gates (.github/SETUP.md, Main does not build)."
            exit 1
          fi
      - name: bosun review-ci
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./target/release/bosun review-ci "$PR"
