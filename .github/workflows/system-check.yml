name: system-check

# Weekly check of system.toml against the live providers (D-031, hoist spec §17.5). It keeps ONE
# issue labelled `system-check` current (opened or edited while something is off, closed when
# clean) and fails only on drift (exit 1) or a broken system.toml (exit 3); `unknown` (no token,
# no probe) and a pending rotation (exit 2) never fail the job. Weekly, not nightly, and no
# comment, label or edit trigger (D-007); the job-level `if:` skips every other event and any ref
# but the default branch. hoist is built from this workspace at the default branch head, never
# downloaded. The issue (title, label), the report job and the exits are the same as in the hull
# templates' system-check.yml (hoist spec §17.4; hull tests/system-description.test.mjs keeps
# them equal): drift that is ONLY `metadata` (TODO owner or purpose, missing dates) is listed in
# the issue but keeps the job green; `hoist system stamp` clears it. Any other drift, or exit 3,
# fails.
#
# Two jobs, so no repo code ever runs with `issues: write`: `check` (contents: read) builds hoist,
# runs `hoist system check --live --json` and the offline `hoist system check --json`, and uploads
# both reports and their exit codes; `report` (issues: write, no checkout, no repo script) reads
# that artifact with jq and edits the issue with gh only.
#
# Live tokens: only the job's own GITHUB_TOKEN. A provider token (Cloudflare, npm, crates, Fly)
# would be one more credential and needs its own entry in system.toml first; until then those
# providers report `unknown`.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

concurrency:
  group: system-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      - name: Build hoist
        run: cargo build --release --locked -p keel-hoist --bin hoist
      - name: hoist system check --live and offline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out="$RUNNER_TEMP/system-check"
          mkdir -p "$out"
          ./target/release/hoist system check --live --json > "$out/live.json"
          echo "$?" > "$out/live.exit"
          ./target/release/hoist system check --json > "$out/offline.json"
          echo "$?" > "$out/offline.exit"
          echo "hoist system check --live exited $(cat "$out/live.exit"), offline $(cat "$out/offline.exit")"
          exit 0
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: system-check
          path: ${{ runner.temp }}/system-check
          retention-days: 7
          if-no-files-found: error

  # Privileged: no checkout and no repo code; only the artifact above, jq and gh.
  report:
    needs: check
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: system-check
          path: ${{ runner.temp }}/system-check
      - name: Read the exit codes
        id: check
        run: |
          set -euo pipefail
          for k in live offline; do
            code=$(head -c 8 "$RUNNER_TEMP/system-check/$k.exit" 2>/dev/null | tr -d '[:space:]' || true)
            [[ $code =~ ^[0-9]{1,3}$ ]] || code=3
            echo "$k=$code" >> "$GITHUB_OUTPUT"
          done
      # Every cell loses `|`, newlines and backticks and every @ gets a zero-width space (no
      # mentions, no code spans); a human step's url is kept only when it is a plain https URL.
      - name: Update the system-check issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXIT: ${{ steps.check.outputs.live }}
          OFFLINE: ${{ steps.check.outputs.offline }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          json="$RUNNER_TEMP/system-check/live.json"
          body="$RUNNER_TEMP/body.md"
          title="system.toml: drift or credentials to rotate"
          gh label create system-check --color fbca04 --description "hoist system check --live" --force >/dev/null
          number=$(gh issue list --label system-check --state open --limit 100 --json number,title | jq -r --arg t "$title" '[.[] | select(.title == $t)] | sort_by(.number) | .[0].number // empty')
          if [ "$EXIT" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The weekly system check is clean again: $RUN_URL"
            fi
            exit 0
          fi
          if ! jq -e '.items | type == "array"' "$json" >/dev/null 2>&1; then
            printf 'hoist system check --live exited %s without a JSON report; see %s\n' "$EXIT" "$RUN_URL" > "$body"
          else
            {
              printf 'hoist system check --live exited %s (offline %s; 1 drift, 2 rotation due, 3 config). Run: %s\n\n' "$EXIT" "$OFFLINE" "$RUN_URL"
              printf '| action | kind | key | reason | source |\n| --- | --- | --- | --- | --- |\n'
              jq -r 'def cell: tostring | gsub("[|\n\r`]"; " ") | gsub("@"; "@​"); .items[] | select(.action != "ok") | "| \(.action | cell) | \(.kind | cell) | \(.key | cell) | \(.reason | cell) | \(.source // "" | cell) |"' "$json"
              jq -r 'def cell: tostring | gsub("[|\n\r`]"; " ") | gsub("@"; "@​"); def link: if type == "string" and test("^https://[A-Za-z0-9._~/?#&=%+:-]+$") then " <\(.)>" else "" end; (.human_steps // []) as $s | if ($s | length) > 0 then "\nHuman steps:\n", ($s[] | "- \(.title | cell)\(.url | link)") else empty end' "$json"
              # shellcheck disable=SC2016 # literal backticks: markdown code spans
              printf '\nFix: edit system.toml (dates: `hoist system stamp`), rotate what is due, then `hoist system explain --write`. Only metadata is listed, never values. This issue closes itself on a clean run.\n'
            } > "$body"
          fi
          if [ "$(wc -c < "$body")" -gt 60000 ]; then
            head -c 60000 "$body" > "$body.cut"
            printf '\n\n... (truncated; see %s)\n' "$RUN_URL" >> "$body.cut"
            mv "$body.cut" "$body"
          fi
          if [ -n "$number" ]; then
            gh issue edit "$number" --title "$title" --body-file "$body"
          else
            gh issue create --title "$title" --label system-check --body-file "$body"
          fi
      - name: Fail on drift or a broken file
        env:
          EXIT: ${{ steps.check.outputs.live }}
          REPORT: ${{ runner.temp }}/system-check/live.json
        run: |
          case "$EXIT" in
            0 | 2) echo "hoist system check --live: exit $EXIT (0 clean, 2 rotation due)" ;;
            1)
              # Only `metadata` drift (TODO or missing dates): warn, stay green.
              if jq -e '[.items[] | select(.action == "drift")] | length > 0 and all(.kind == "metadata")' "$REPORT" > /dev/null 2>&1; then
                echo "::warning::hoist system check --live: only metadata drift (TODO or missing dates); see the system-check issue"
              else
                echo "::error::hoist system check --live exited 1 (drift); see the system-check issue"; exit 1
              fi
              ;;
            *) echo "::error::hoist system check --live exited $EXIT (3 invalid system.toml or API error); see the system-check issue"; exit 1 ;;
          esac
