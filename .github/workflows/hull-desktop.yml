name: hull-desktop

# Weekly (D-007) plus by hand: renders hull's `desktop` combo into a scratch repo and builds the
# Tauri app on Linux, to catch drift in the Tauri, Rust and system-package versions. Ported from
# hull/.github/workflows/desktop.yml. No push or PR trigger: hull's PR checks are in ci.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: hull-desktop
  cancel-in-progress: false

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: hull
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: hull/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: hull/.node-version
          cache: pnpm
          cache-dependency-path: hull/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Render the desktop combo
        run: |
          args=$(node -e 'import("./scripts/lib/combos.mjs").then(({ loadCombos }) => { const { vars, combos } = loadCombos(); const c = combos.find((x) => x.name === "desktop"); process.stdout.write([...c.pieces.map((p) => "--piece " + p), ...Object.entries(vars).map(([k, v]) => "--data " + k + "=" + v)].join(" ")) })')
          read -ra argv <<<"$args"
          node scripts/render.mjs new --template template --out "$RUNNER_TEMP/desktop" "${argv[@]}"
      - name: Install Tauri system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      # Bump by hand to the `stable` branch head; `toolchain: stable` is explicit, so a digest bump to master stays safe.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-28
        with:
          toolchain: stable
      - name: Install generated repo
        working-directory: ${{ runner.temp }}/desktop
        run: |
          git init -q
          pnpm install --no-frozen-lockfile
      - name: Build desktop
        working-directory: ${{ runner.temp }}/desktop
        run: pnpm turbo run build:desktop
