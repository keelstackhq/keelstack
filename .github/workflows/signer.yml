name: signer

# The keyless fast lane (spec §8, D-017): a session with no key asks for an autonomous approval
# with `bosun approve <pr>@<head> --via-signer`, which returns the dispatch call for this
# workflow. Run only from the default branch, never checks out the PR: the signing decision runs
# from default-branch code, built from the workspace. `sign` holds the signer key
# (environment bosun-signer: deployment branches limited to the default branch, secret
# BOSUN_SIGNER_KEY) and never the App key; `judge` holds the App key and never the signer key,
# because a comment posted with GITHUB_TOKEN starts no workflow. `mirror` (App key, before
# `sign`) posts the gate App's `bosun-ci-ok` check run from the `ci-ok` job of the newest ci.yml
# run on the PR head (`bosun gate ci-ok`; never for a PR that changes ci.yml): the signer counts
# only that run, since any workflow can post a GitHub Actions run named `ci-ok`. Its own name
# keeps it apart from the required `ci-ok`. `bosun approve --as signer` signs only
# under the quorum or autonomous policy with `[checks] mode = "checks"`, for the PR's current
# head, after every D-017 check and a green ci-ok. Event data reaches `run:` lines through `env:`
# only, never as `${{ }}` in a script.
#
# Monorepo: ONE copy for the whole repo; the head's `ci-ok` is the aggregate of every ci-<folder>.
# workflow_dispatch only: no event starts it, so it spends minutes only when a session asks.
# Config: bosun reads `<git top level>/.bosun/*` (ctx.rs, `git rev-parse --show-toplevel`): the
# monorepo's root .bosun/ of the checked-out commit (bosun.toml with [[folders]], risk.toml, ...).
on:
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
        type: string
      head:
        description: The 40-hex head sha to approve (must still be the PR head)
        required: true
        type: string
      requester:
        description: The session that asked (never the independent reviewer)
        required: true
        type: string

concurrency:
  group: signer-${{ inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate App's bosun-ci-ok for the head (spec §8): mirrors the ci-ok job of the newest ci.yml run
  # on the PR head, read from the API (a run of any other workflow file never counts). App key
  # only, never the signer key. A head whose ci.yml has not finished posts nothing and fails, so
  # `sign` does not run.
  mirror:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: bosun-app
      deployment: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A dispatch runs on the default branch: github.sha is its head, never a PR's.
          ref: ${{ github.sha }}
          persist-credentials: false
      # bosun is built from this workspace (never downloaded): the checkout above is the base
      # commit or the default branch, so the binary comes from reviewed code, never from the PR head.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      # No rust-cache here: this job holds a secret, and a cache another job could write must not
      # reach what it builds or runs.
      # No pinned-release fallback yet: no monorepo release exists, and the old keelstackhq/bosun
      # releases (<= 0.21.0, .bosun/version) cannot read [[folders]], so they would mis-judge. A
      # base whose bosun does not build fails this gate closed (.github/SETUP.md, "Main does not
      # build"); the fallback to the pinned release returns with the first monorepo release.
      - name: build bosun
        run: |
          if ! cargo build --release --locked -p keel-bosun --bin bosun; then
            echo "::error::bosun does not build at the base commit: this gate cannot judge and fails closed (no pinned-release fallback until the first monorepo release). Fix: a bosun:kind/mainfix PR that makes bosun build on main, merged by the owner past the gates (.github/SETUP.md, Main does not build)."
            exit 1
          fi
      # The App token (spec §15): the key goes to this step only, the token only to bosun.
      - name: App token
        id: app
        # bosun fails closed without the token (nothing posted, `sign` does not run).
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOSUN_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOSUN_APP_KEY }}
          permission-checks: write
      - name: bosun gate ci-ok
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_APP_TOKEN: ${{ steps.app.outputs.token }}
          BOSUN_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          printf '%s' "$PR" | grep -Eqx '[0-9]+' || { echo "::error::pr must be digits"; exit 1; }
          ./target/release/bosun gate ci-ok --pr "$PR"

  sign:
    needs: mirror
    # Only the default branch's copy of this file may sign.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: bosun-signer
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A dispatch runs on the default branch: github.sha is its head, never a PR's.
          ref: ${{ github.sha }}
          persist-credentials: false
      # bosun is built from this workspace (never downloaded): the checkout above is the base
      # commit or the default branch, so the binary comes from reviewed code, never from the PR head.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      # No rust-cache here: this job holds a secret, and a cache another job could write must not
      # reach what it builds or runs.
      # No pinned-release fallback yet: no monorepo release exists, and the old keelstackhq/bosun
      # releases (<= 0.21.0, .bosun/version) cannot read [[folders]], so they would mis-judge. A
      # base whose bosun does not build fails this gate closed (.github/SETUP.md, "Main does not
      # build"); the fallback to the pinned release returns with the first monorepo release.
      - name: build bosun
        run: |
          if ! cargo build --release --locked -p keel-bosun --bin bosun; then
            echo "::error::bosun does not build at the base commit: this gate cannot judge and fails closed (no pinned-release fallback until the first monorepo release). Fix: a bosun:kind/mainfix PR that makes bosun build on main, merged by the owner past the gates (.github/SETUP.md, Main does not build)."
            exit 1
          fi
      - name: sign
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_REPO: ${{ github.repository }}
          BOSUN_SESSION: signer-ci-${{ github.run_id }}
          SIGNER_KEY: ${{ secrets.BOSUN_SIGNER_KEY }}
          PR: ${{ inputs.pr }}
          HEAD: ${{ inputs.head }}
          REQUESTER: ${{ inputs.requester }}
        run: |
          printf '%s' "$PR" | grep -Eqx '[0-9]+' || { echo "::error::pr must be digits"; exit 1; }
          printf '%s' "$HEAD" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::head must be 40 hex digits"; exit 1; }
          printf '%s' "$REQUESTER" | grep -Eqx '[A-Za-z0-9._/:-]{1,200}' || { echo "::error::requester must be a plain session id"; exit 1; }
          umask 077
          printf '%s\n' "$SIGNER_KEY" > "$RUNNER_TEMP/signer.pem"
          ./target/release/bosun approve "$PR@$HEAD" --sign-key "$RUNNER_TEMP/signer.pem" --bootstrap --as signer --requester "$REQUESTER"
      - name: remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/signer.pem"

  judge:
    needs: sign
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: bosun-app
      deployment: false
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A dispatch runs on the default branch: github.sha is its head, never a PR's.
          ref: ${{ github.sha }}
          persist-credentials: false
      # bosun is built from this workspace (never downloaded): the checkout above is the base
      # commit or the default branch, so the binary comes from reviewed code, never from the PR head.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      # No rust-cache here: this job holds a secret, and a cache another job could write must not
      # reach what it builds or runs.
      # No pinned-release fallback yet: no monorepo release exists, and the old keelstackhq/bosun
      # releases (<= 0.21.0, .bosun/version) cannot read [[folders]], so they would mis-judge. A
      # base whose bosun does not build fails this gate closed (.github/SETUP.md, "Main does not
      # build"); the fallback to the pinned release returns with the first monorepo release.
      - name: build bosun
        run: |
          if ! cargo build --release --locked -p keel-bosun --bin bosun; then
            echo "::error::bosun does not build at the base commit: this gate cannot judge and fails closed (no pinned-release fallback until the first monorepo release). Fix: a bosun:kind/mainfix PR that makes bosun build on main, merged by the owner past the gates (.github/SETUP.md, Main does not build)."
            exit 1
          fi
      # The App token (spec §15): the key goes to this step only, the token only to bosun.
      - name: App token
        id: app
        # A missing or broken key never stops the gate: bosun falls back per [checks] mode.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOSUN_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOSUN_APP_KEY }}
          permission-checks: write
      - name: bosun risk-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_APP_TOKEN: ${{ steps.app.outputs.token }}
          BOSUN_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        # Exit 5 (needs-human) is the verdict, carried by the status; only errors fail the job.
        run: |
          printf '%s' "$PR" | grep -Eqx '[0-9]+' || { echo "::error::pr must be digits"; exit 1; }
          ./target/release/bosun risk-check "$PR" || test $? -eq 5
