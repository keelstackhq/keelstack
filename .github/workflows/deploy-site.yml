name: deploy-site

# Keeps keelstack.dev current (D-024). Every fact on the home page is generated at build time from
# the tool folders, the root Cargo.toml and hull's pieces, so the site is rebuilt and deployed when:
#   - a push to main touches site/ or a folder it depends on (.bosun/bosun.toml, folder `site`),
#   - release.yml finishes (the version bump reached main earlier; this deploys the released state),
#   - someone runs it by hand.
# A pull request that touches the same paths checks and builds the site (job `build`; a draft starts
# no runner). It never gets the Cloudflare secrets: job `deploy` runs only off a pull request, in the
# environment `site` (deployment branches: default branch only), which holds CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (.github/SETUP.md). `deploy` checks and builds what it deploys itself: no
# artifact crosses jobs or runs, so nothing a pull request wrote can reach a deploy.
#
# D-007: Linux only, no comment/label/edit triggers, job-level `if:`, one build per run.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - bosun/**
      - splice/**
      - hull/**
      - hoist/**
      - hoard/**
      - berth/**
      - keel/**
      - Cargo.toml
      - .github/workflows/deploy-site.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - site/**
      - bosun/**
      - splice/**
      - hull/**
      - hoist/**
      - hoard/**
      - berth/**
      - keel/**
      - Cargo.toml
      - .github/workflows/deploy-site.yml
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # A deploy is queued, never cancelled half-way; a newer PR push replaces the older build.
  group: deploy-site-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The state to build: main's head after a release run (the release commit moved it), else this run's commit.
  SITE_REF: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}

jobs:
  # Pull requests: check and build only.
  build:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SITE_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      # The tests build the site, compare the rendered page with the generated facts and check links.
      - name: Check and build
        run: pnpm run ci

  # main (push, a successful release run, a manual run): the same checks and build, then the deploy.
  deploy:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: site
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be secrets of the environment site (.github/SETUP.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SITE_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      # A page that disagrees with its sources is never deployed.
      - name: Check and build
        run: pnpm run ci
      - name: Deploy to Cloudflare Pages
        working-directory: site/apps/site
        run: pnpm exec wrangler pages deploy dist --project-name keelstack-landing --branch main
