name: deploy-site

# Keeps keelstack.dev current (D-024). The site always shows main's state: every fact on the home
# page is generated at build time from the tool folders, the root Cargo.toml and hull's pieces, so
# the site is rebuilt and deployed when:
#   - a push to main touches site/ or a folder it depends on (folder `site` in .bosun/bosun.toml),
#   - release.yml finishes (the tag now exists; deploy-site-release.yml dispatches this workflow, so
#     the new released version reaches the page),
#   - someone runs it by hand on main.
# Pull requests are checked and built by ci.yml (job ci-site), not here.
#
# What the page says about releases never comes from an untagged Cargo version: the version,
# install commands and sources (`@vX`) come from the latest release tag vX.Y.Z reachable from the
# built commit (RELEASED_VERSION, resolved by job `decide`; site/apps/site/src/data/facts.ts).
# Before the first release above 0.21.0 there is none, and the page pins the old repos' last
# releases (legacy.ts). A release commit sits on top of a main commit and only the tag reaches it
# (release.yml), so a tag counts when its first parent is the built commit or an ancestor of it.
# A version-bump push therefore builds with the previous release's facts (its generated docs, made
# for the new version, fail the drift test: nothing is deployed); the release run's completion
# deploys the new ones.
#
# Three jobs, so no secret meets installed code:
#   decide  resolves the commit (this run's: main's head) and the release tag.
#   build   checks out that commit, installs, runs `ci` (build, lint, tests) and uploads one
#           archive (dist + wrangler, installed from the lockfile) with its sha256. No secrets, no
#           environment.
#   deploy  environment `site` (deployment branches: default branch only) holds
#           CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (.github/SETUP.md). It checks out and
#           installs nothing: it verifies the archive's sha256 against build's output and runs
#           the archived wrangler on the archived dist. Only `Check secrets` and the deploy step
#           see the secrets.
#
# D-007: Linux only, no comment/label/edit triggers, job-level `if:`, one build per run.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - bosun/**
      - splice/**
      - hull/**
      - hoist/**
      - hoard/**
      - berth/**
      - keel/**
      - Cargo.toml
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

# ci-minutes: allow concurrency deploys queue in one group and never cancel one half-way
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The commit to build (this run's: main's head) and the latest release tag reachable from it
  # (read-only API). A manual run deploys only from main.
  decide:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      released: ${{ steps.release.outputs.released }}
    env:
      SITE_SHA: ${{ github.sha }}
    steps:
      - name: Latest release tag reachable from the commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SITE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SITE_SHA' is not a commit sha"; exit 1; }
          echo "sha=$SITE_SHA" >> "$GITHUB_OUTPUT"
          refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref')"
          # Release tags only: vX.Y.Z, highest first (version order, not text order).
          tags="$(grep -E '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$refs" | sed 's|^refs/tags/v||' | sort -V -r || true)"
          released=""
          for v in $tags; do
            # The release commit is only on the tag (a child of a main commit): the tag counts
            # when its first parent is the built commit or comes before it.
            parent="$(gh api "repos/$GITHUB_REPOSITORY/commits/v$v" --jq '.parents[0].sha')"
            [[ "$parent" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag v$v has no parent commit"; exit 1; }
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$parent...$SITE_SHA" --jq .status)"
            if [ "$status" = ahead ] || [ "$status" = identical ]; then
              released="$v"
              break
            fi
          done
          if [ -n "$released" ]; then
            echo "::notice::latest release tag reachable from $SITE_SHA: v$released"
          else
            echo "::notice::no release tag reachable from $SITE_SHA: the page pins the legacy releases"
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"

  # Check and build the commit `decide` resolved. No secrets, no environment.
  build:
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      # Exactly the commit decide resolved, not main's head a second time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile --prefer-offline
      # A page that disagrees with its sources is never deployed. The released version is the
      # latest tag's, empty before the first release.
      - name: Check and build
        working-directory: site
        env:
          RELEASED_VERSION: ${{ needs.decide.outputs.released }}
        run: pnpm run ci
      # One archive: the built site and wrangler with its locked closure (pnpm deploy of the
      # workspace package that depends on wrangler only), so `deploy` installs nothing.
      - name: Pack the site
        id: pack
        run: |
          mkdir stage
          cp -r site/apps/site/dist stage/dist
          pnpm --dir site --filter @keelstackhq/deploy deploy --prod "$PWD/stage/wrangler"
          tar -C stage -czf site-dist.tgz .
          echo "digest=$(sha256sum site-dist.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: site-dist
          path: site-dist.tgz
          if-no-files-found: error
          retention-days: 1

  # main (push, a manual run on main): deploy the verified build.
  deploy:
    needs: [decide, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be secrets of the environment site (.github/SETUP.md)"
            exit 1
          fi
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: site-dist
          path: artifact
      # Only the archive build hashed is deployed.
      - name: Verify the artifact
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build produced no sha256"; exit 1; }
          echo "$DIGEST  artifact/site-dist.tgz" | sha256sum -c -
          tar -xzf artifact/site-dist.tgz
          [ -f dist/index.html ] || { echo "::error::the artifact has no index.html"; exit 1; }
          wrangler/node_modules/.bin/wrangler --version
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_SHA: ${{ needs.decide.outputs.sha }}
        run: wrangler/node_modules/.bin/wrangler pages deploy dist --project-name keelstack-landing --branch main --commit-hash "$SITE_SHA"
