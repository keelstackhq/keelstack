name: deploy-site

# Keeps keelstack.dev current (D-024). Every fact on the home page is generated at build time from
# the tool folders, the root Cargo.toml and hull's pieces, so the site is rebuilt and deployed when:
#   - a push to main touches site/ or a folder it depends on (.bosun/bosun.toml, folder `site`),
#   - release.yml finishes (the version bump reached main earlier; this deploys the released state),
#   - someone runs it by hand on main.
# Pull requests are checked and built by ci.yml (job ci-site), not here. Job `decide` deploys only
# a released version: when the root Cargo.toml `[workspace.package] version` has no tag vX.Y.Z
# yet (a version-bump push), it skips, and the release run's completion deploys it. Job `deploy`
# runs in the environment `site` (deployment branches: default branch only), which holds
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (.github/SETUP.md). Only the steps `Check
# secrets` and `Deploy to Cloudflare Pages` see them: pnpm install, the build and the tests run
# without them. `deploy` checks and builds what it deploys itself: no artifact crosses jobs or runs.
#
# D-007: Linux only, no comment/label/edit triggers, job-level `if:`, one build per run.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - bosun/**
      - splice/**
      - hull/**
      - hoist/**
      - hoard/**
      - berth/**
      - keel/**
      - Cargo.toml
      - .github/workflows/deploy-site.yml
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# ci-minutes: allow concurrency a deploy is queued, never cancelled half-way
concurrency:
  # A deploy is queued, never cancelled half-way.
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The state to build: main's head after a release run (the release commit moved it), else this run's commit.
  SITE_REF: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}

jobs:
  # Deploy only a released version: the tag v<root Cargo.toml version> must exist (read-only API).
  decide:
    if: >-
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.tag.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SITE_REF }}
          persist-credentials: false
          sparse-checkout: Cargo.toml
          sparse-checkout-cone-mode: false
      - name: Is the version released
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(awk '/^\[/ { s = ($0 == "[workspace.package]") } s && /^version[[:space:]]*=/ { gsub(/.*=[[:space:]]*"|".*/, ""); print; exit }' Cargo.toml)"
          [ -n "$v" ] || { echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; }
          refs="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v$v" --jq '.[].ref')"
          if grep -qxF "refs/tags/v$v" <<<"$refs"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::v$v has no tag yet (version bump before its release): not deployed; the release run's completion deploys it"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # main (push, a successful release run, a manual run on main): check, build, then deploy.
  deploy:
    needs: decide
    if: needs.decide.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: site
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be secrets of the environment site (.github/SETUP.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SITE_REF }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile --prefer-offline
      # A page that disagrees with its sources is never deployed.
      - name: Check and build
        run: pnpm run ci
      - name: Deploy to Cloudflare Pages
        working-directory: site/apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name keelstack-landing --branch main
