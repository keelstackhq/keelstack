name: deploy-site

# Keeps keelstack.dev current (D-024). The site always shows main's state: every fact on the home
# page is generated at build time from the tool folders, the root Cargo.toml and hull's pieces, so
# the site is rebuilt and deployed when:
#   - a push to main touches site/ or a folder it depends on (folder `site` in .bosun/bosun.toml),
#   - release.yml finishes (the tag now exists; deploy-site-release.yml dispatches this workflow, so
#     the new released version reaches the page),
#   - someone runs it by hand on main.
# Pull requests are checked and built by ci.yml (job ci-site), not here.
#
# What the page says about releases never comes from an untagged Cargo version: the version,
# install commands and sources (`@vX`) come from the latest release tag vX.Y.Z reachable from the
# built commit whose npm packages (every launcher and platform package the page installs) are all
# published; else the next lower release that is fully published; else the old repos' last
# releases (legacy.ts). Job `decide` lists the reachable tags (`candidates`, highest first); job
# `build` asks npm (site/apps/site/scripts/published.ts) and sets RELEASED_VERSION. A release
# commit sits on top of a main commit and only the tag reaches it (release.yml), so a tag counts
# when its first parent is the built commit or an ancestor of it.
# The generated docs pages are regenerated in the build for that version (gen-docs.ts), so they
# agree with it by construction: a version-bump push, or a release whose packages are not all on
# npm yet, deploys the previous facts instead of failing. The release run's completion (also a
# failed one, which may have published part of it) deploys again.
#
# Four jobs, so no secret meets code a site script could have touched:
#   decide   resolves the commit (this run's: main's head) and the release tag.
#   build    checks out that commit, installs, runs `ci` (build, lint, tests) and uploads dist only,
#            with its sha256. No secrets, no environment.
#   wrangler checks out the same commit, runs no site script and only stages wrangler from the
#            lockfile (`pnpm deploy --ignore-scripts`); uploads it with its sha256. No secrets.
#   deploy   environment `site` (deployment branches: default branch only) holds
#            CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (.github/SETUP.md). It checks out and
#            installs nothing: it verifies both sha256 against the jobs' outputs, takes only
#            `dist/` from the site archive (regular files and directories only) and runs the
#            wrangler of the wrangler archive on it. Only `Check secrets` and the deploy step
#            see the secrets.
#
# D-007: Linux only, no comment/label/edit triggers, job-level `if:`, one build per run.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - bosun/**
      - splice/**
      - hull/**
      - hoist/**
      - hoard/**
      - berth/**
      - keel/**
      - Cargo.toml
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

# ci-minutes: allow concurrency deploys queue in one group and never cancel one half-way
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The commit to build (this run's: main's head) and the latest release tag reachable from it
  # (read-only API). A manual run deploys only from main.
  decide:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      released: ${{ steps.release.outputs.released }}
      candidates: ${{ steps.release.outputs.candidates }}
    env:
      SITE_SHA: ${{ github.sha }}
    steps:
      - name: Latest release tag reachable from the commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SITE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SITE_SHA' is not a commit sha"; exit 1; }
          echo "sha=$SITE_SHA" >> "$GITHUB_OUTPUT"
          # Read-only API calls retry (3 tries, RETRY_SLEEP seconds apart) and still fail closed.
          ghr() {
            local i
            for i in 1 2 3; do
              gh api "$@" && return 0
              [ "$i" = 3 ] || sleep "${RETRY_SLEEP:-5}"
            done
            return 1
          }
          refs="$(ghr --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref')"
          # Release tags only: vX.Y.Z, highest first (version order, not text order).
          tags="$(grep -E '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' <<<"$refs" | sed 's|^refs/tags/v||' | sort -V -r || true)"
          released=""
          candidates=""
          for v in $tags; do
            # From the reachable tag found on: it and every lower release tag (version order).
            # Lower tags are older releases cut from main (release.yml), so they are candidates
            # without a reachability check; npm decides in job `build` which one is published.
            if [ -n "$released" ]; then
              candidates="$candidates $v"
              continue
            fi
            # The release commit is only on the tag (a child of a main commit): the tag counts
            # when its first parent is the built commit or comes before it.
            parent="$(ghr "repos/$GITHUB_REPOSITORY/commits/v$v" --jq '.parents[0].sha')"
            [[ "$parent" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::tag v$v has no parent commit"; exit 1; }
            status="$(ghr "repos/$GITHUB_REPOSITORY/compare/$parent...$SITE_SHA" --jq .status)"
            if [ "$status" = ahead ] || [ "$status" = identical ]; then
              released="$v"
              candidates="$v"
            fi
          done
          if [ -n "$released" ]; then
            echo "::notice::latest release tag reachable from $SITE_SHA: v$released"
          else
            echo "::notice::no release tag reachable from $SITE_SHA: the page pins the legacy releases"
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"

  # Check and build the commit `decide` resolved. No secrets, no environment.
  build:
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      # Exactly the commit decide resolved, not main's head a second time.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        working-directory: site
        run: pnpm install --frozen-lockfile --prefer-offline
      # The release the page shows: the first candidate (the latest reachable tag, then lower
      # ones) whose npm packages are all published; empty = the legacy pins. The generated docs
      # are rendered for it, so they cannot disagree with the facts.
      - name: Published release
        working-directory: site
        env:
          CANDIDATES: ${{ needs.decide.outputs.candidates }}
        run: |
          # shellcheck disable=SC2086 # CANDIDATES is a space separated list of X.Y.Z
          v="$(node apps/site/scripts/published.ts $CANDIDATES)"
          [[ -z "$v" || "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$v' is not a release version"; exit 1; }
          if [ -n "$v" ]; then
            echo "::notice::the page shows v$v (candidates: ${CANDIDATES:-none})"
          else
            echo "::notice::no candidate is fully published (${CANDIDATES:-none}): the page pins the legacy releases"
          fi
          echo "RELEASED_VERSION=$v" >> "$GITHUB_ENV"
      - name: Generate the docs for it
        working-directory: site
        run: node apps/site/scripts/gen-docs.ts
      # A page that disagrees with its sources is never deployed.
      - name: Check and build
        working-directory: site
        run: pnpm run ci
      # Only the built site, packed. Wrangler is staged by job `wrangler`, never here: this job ran
      # every site script, so nothing it leaves may be run with the token.
      - name: Pack the site
        id: pack
        run: |
          tar -C site/apps/site -czf site-dist.tgz dist
          echo "digest=$(sha256sum site-dist.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: site-dist
          path: site-dist.tgz
          if-no-files-found: error
          retention-days: 1

  # Stages wrangler with its locked closure (pnpm deploy of the workspace package that depends on
  # wrangler only). No secrets, runs no site script (`--ignore-scripts`, no install of the
  # workspace, no cache a `build` run could write): what it loads is site/package.json,
  # pnpm-lock.yaml, pnpm-workspace.yaml, .node-version, .npmrc, .pnpmfile.* and
  # packages/deploy, all quorum trust root (bosun risk::TRUST_ROOT).
  wrangler:
    needs: decide
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Stage wrangler
        id: pack
        run: |
          mkdir stage
          pnpm --dir site --filter ./packages/deploy deploy --prod --ignore-scripts "$PWD/stage/wrangler"
          stage/wrangler/node_modules/.bin/wrangler --version
          tar -C stage -czf wrangler.tgz wrangler
          echo "digest=$(sha256sum wrangler.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wrangler
          path: wrangler.tgz
          if-no-files-found: error
          retention-days: 1

  # main (push, a manual run on main): deploy the verified build.
  deploy:
    needs: [decide, build, wrangler]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: site
    steps:
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be secrets of the environment site (.github/SETUP.md)"
            exit 1
          fi
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: site-dist
          path: artifact/site
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: wrangler
          path: artifact/wrangler
      # Only the archives the jobs hashed are used. From the site archive only `dist/` is taken,
      # and it may hold regular files and directories only: a symlink (to /proc/self/environ, say)
      # would upload the token. Wrangler comes from its own archive.
      - name: Verify the artifacts
        env:
          SITE_DIGEST: ${{ needs.build.outputs.digest }}
          WRANGLER_DIGEST: ${{ needs.wrangler.outputs.digest }}
        run: |
          [[ "$SITE_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::build produced no sha256"; exit 1; }
          [[ "$WRANGLER_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::wrangler produced no sha256"; exit 1; }
          echo "$SITE_DIGEST  artifact/site/site-dist.tgz" | sha256sum -c -
          echo "$WRANGLER_DIGEST  artifact/wrangler/wrangler.tgz" | sha256sum -c -
          tar -xzf artifact/site/site-dist.tgz dist
          tar -xzf artifact/wrangler/wrangler.tgz wrangler
          [ -f dist/index.html ] || { echo "::error::the artifact has no index.html"; exit 1; }
          odd="$(find dist ! -type f ! -type d -print)"
          if [ -n "$odd" ]; then
            echo "::error::dist holds something other than regular files and directories:"
            echo "$odd"
            exit 1
          fi
          wrangler/node_modules/.bin/wrangler --version
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_SHA: ${{ needs.decide.outputs.sha }}
        run: wrangler/node_modules/.bin/wrangler pages deploy dist --project-name keelstack-landing --branch main --commit-hash "$SITE_SHA"
