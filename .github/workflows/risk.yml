name: risk

# Posts the required `risk-check` status (spec §8, D32). It runs again on a PR comment
# `/bosun approve <head sha>` (an owner's approval) or `/bosun recheck` (a repo owner, member or
# collaborator: it only re-judges; anyone else's runs no job, which limits CI minutes only, since
# an outsider's `/bosun approve` still re-judges, harmlessly). A recheck from an owner with private
# org membership or from an app (author_association NONE) is dropped too: re-run the workflow.
# An owner's GitHub review is read on the next run (a push, `/bosun recheck` or a re-run): there
# is no review trigger, because `pull_request_review` runs the PR's own copy of this file, with
# this token, so a PR could rewrite the job and post its own `risk-check`. So a withdrawal
# changes nothing by itself: to withdraw, request changes or dismiss the approval, then comment
# `/bosun recheck` (or re-run the risk workflow; it re-judges and fails); turning off auto-merge
# also stops a merge.
#
# pull_request_target and issue_comment run this file from the base (default) branch, so a PR
# cannot rewrite the job that judges it. The job never checks out or runs PR-head code: it builds
# bosun from the workspace at the PR's base commit (on a comment or a push: the default branch)
# and reads the PR through the API only. Event data reaches `run:` lines through `env:` only,
# never as `${{ }}` in a script.
#
# Monorepo: ONE copy of this workflow judges every PR of the whole repo (D-007: no per-folder
# copies). PR edits that touch neither the body nor the base run no job (the Risk note and the
# task links live in the body).
# Config: bosun reads `<git top level>/.bosun/*` (ctx.rs, `git rev-parse --show-toplevel`): the
# monorepo's root .bosun/ of the checked-out commit (bosun.toml with [[folders]], risk.toml, ...).
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created]
  # The base moved: re-judge every open PR against main. One job, one run per push. What the
  # re-judge picks up: bosun's code (built from main's new head, so its built-in rules and
  # checks), the PR's current files, reviews, comments and statuses. What it does not: the
  # base-side config (.bosun/risk.toml, owners, plan, [[folders]]) is read at the PR's
  # `base.sha` from the API (risk_check.rs, pull.base_sha), which GitHub moves only when the PR's
  # head is pushed or its base is changed, not when main moves. New risk rules on main judge a
  # PR from its next push (or base change) on.
  push:
    branches: [main]

# A comment that is neither an approval nor a recheck by the repo's people, and an edit that
# changes neither body nor base, get a group of their own: their runs are skipped and must never
# cancel the run that judges a new head.
concurrency:
  group: >-
    risk-${{ github.event.pull_request.number || github.event.issue.number || 'main' }}-${{
    ((github.event_name == 'issue_comment' && !contains(github.event.comment.body, '/bosun approve')
    && !(contains(github.event.comment.body, '/bosun recheck') &&
    contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    || (github.event.action == 'edited' && !github.event.changes.body && !github.event.changes.base))
    && github.run_id || 'judge' }}
  cancel-in-progress: true

# Least privilege: statuses for the verdict; pull-requests: write only because risk-check writes
# the Risk note into the PR body (spec §8); read for the base files, comments and linked issues.
permissions:
  contents: read
  issues: read
  pull-requests: write
  statuses: write

jobs:
  risk:
    # On a comment: only PR comments that ask for an approval (open to all: bosun counts only an
    # owner's) or a recheck from the repo's owners, members and collaborators (a recheck only
    # re-judges; the filter limits CI minutes only). On the PR events: not for a draft (no runner
    # starts; `ready_for_review` judges it) and not for an edit of the title alone. A comment on
    # a draft still judges, as before.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.body || github.event.changes.base)) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (contains(github.event.comment.body, '/bosun approve') ||
      (contains(github.event.comment.body, '/bosun recheck') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: bosun-app
      deployment: false
    steps:
      # The PR's base commit (never its head); on a comment or a push, the default branch head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      # bosun is built from this workspace (never downloaded): the checkout above is the base
      # commit or the default branch, so the binary comes from reviewed code, never from the PR head.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
      # No rust-cache here: this job holds a secret, and a cache another job could write must not
      # reach what it builds or runs.
      # No pinned-release fallback yet: no monorepo release exists, and the old keelstackhq/bosun
      # releases (<= 0.21.0, .bosun/version) cannot read [[folders]], so they would mis-judge. A
      # base whose bosun does not build fails this gate closed (.github/SETUP.md, "Main does not
      # build"); the fallback to the pinned release returns with the first monorepo release.
      - name: build bosun
        run: |
          if ! cargo build --release --locked -p keel-bosun --bin bosun; then
            echo "::error::bosun does not build at the base commit: this gate cannot judge and fails closed (no pinned-release fallback until the first monorepo release). Fix: a bosun:kind/mainfix PR that makes bosun build on main, merged by the owner past the gates (.github/SETUP.md, Main does not build)."
            exit 1
          fi
      # The App token (spec §15): the key goes to this step only, the token only to bosun.
      - name: App token
        id: app
        # A missing or broken key never stops the gate: bosun falls back per [checks] mode.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOSUN_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOSUN_APP_KEY }}
          permission-checks: write
      - name: bosun risk-check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOSUN_APP_TOKEN: ${{ steps.app.outputs.token }}
          BOSUN_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        # Exit 5 (needs-human) is the verdict, carried by the status; only errors fail the job.
        # On a push to main: every open PR against main is judged again (the base moved).
        run: |
          if [ "$EVENT" = "push" ]; then
            prs="$(gh api --paginate "repos/$BOSUN_REPO/pulls?state=open&base=main&per_page=100" --jq '.[] | select(.draft | not) | .number')"
            rc=0
            for n in $prs; do
              ./target/release/bosun risk-check "$n" || test $? -eq 5 || rc=1
            done
            exit $rc
          else
            ./target/release/bosun risk-check "$PR" || test $? -eq 5
          fi
