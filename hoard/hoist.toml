# hoard ships binaries in the GitHub release only: release.yml skips it on crates.io
# (SKIP_CRATES) and it has no npm launcher. Repo settings live in the root hoist.toml.

[publish]
github_release = { targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"], bin = "hoard" }
