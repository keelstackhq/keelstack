[workspace]
resolver = "3"
members = ["bosun", "splice", "hoist", "hoard", "berth", "keel"]
# Test fixtures and template files are not workspace crates.
exclude = ["hoist/tests/fixtures", "hull"]

[workspace.package]
# Lockstep version for every tool crate.
version = "0.23.0"

# Exact pins. Crates add their own features.
[workspace.dependencies]
anyhow = "=1.0.104"
assert_cmd = "=2.2.2"
aws-sdk-s3 = { version = "=1.152.0", default-features = false }
axum = "=0.8.9"
base64 = "=0.23.1"
bytes = { version = "=1.12.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false }
clap = "=4.6.7"
crypto_box = { version = "=0.9.1", default-features = false }
dialoguer = { version = "=0.12.0", default-features = false }
diffy = "=0.5.2"
dirs = "=7.0.0"
futures = { version = "=0.3.34", default-features = false }
globset = "=0.4.20"
indexmap = "=2.14.2"
insta = "=1.49.0"
jsonc-parser = "=0.34.0"
minijinja = "=2.24.0"
opendal = { version = "=0.59.4", default-features = false }
predicates = "=3.1.4"
rand = "=0.10.3"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false }
ring = { version = "=0.17.14", default-features = false }
rpassword = "=7.5.4"
rustix = "=1.1.6"
semver = "=1.0.28"
serde = "=1.0.229"
serde_json = "=1.0.154"
sha2 = "=0.11.1"
signal-hook = { version = "=0.4.5", default-features = false }
subtle = "=2.6.1"
tar = { version = "=0.4.46", default-features = false }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tiny_http = "=0.12.0"
tokio = "=1.53.3"
toml = "=1.1.8"
toml_edit = "=0.25.17"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
ureq = "=3.4.2"
walkdir = "=2.5.0"
yaml_serde = "=0.10.7"
zeroize = "=1.9.1"
zstd = "=0.14.4"

# Dev builds: line tables are enough for backtraces; dependencies carry no debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release binaries: single-unit, fat LTO. panic must stay "unwind": bosun hooks wrap their work in
# catch_unwind, and a panicking hoard request task must not kill the server (tokio and axum rely on
# unwinding). opt-level 3 for every dependency (hoard's zstd and crypto C code are hot); the CLIs
# that were size-optimized before keep opt-level "s" for their own code.
[profile.release]
panic = "unwind"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release.package.keel-bosun]
opt-level = "s"

[profile.release.package.keel-splice]
opt-level = "s"

[profile.release.package.keel-berth]
opt-level = "s"
