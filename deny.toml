# cargo-deny for the whole workspace. Merged from the per-tool files; the strictest setting wins.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing attack) is pulled in by opendal-service-ghac's hard dependency on opendal-service-azblob (reqsign-azure-storage) and reqsign-core; hoard never uses Azure or RSA signing, and no opendal feature turns it off. Remove when opendal drops rsa or rsa ships a fix." },
  { id = "RUSTSEC-2026-0441", reason = "pin-utils is unmaintained (no vulnerability); pulled in by aws-smithy-http, aws-smithy-runtime and aws-smithy-types (aws-sdk-s3, hoard). Remove when the AWS SDK stops using it." },
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained (no vulnerability); a direct dependency of hoard (clock only). Remove when hoard moves to another time crate or chrono is maintained again." },
]

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0", # webpki-roots, webpki-root-certs (Mozilla root CA data)
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
exceptions = [
  { name = "option-ext", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
