# Pinned tool versions and their npm integrity values (sha512, base64) for keel's installs.
# [pins] is the same table as a generated repo's root pins.toml (hull); [sha512.<tool>] records
# the dist.integrity of the launcher and platform packages for that tool's `version`.
# Values come from the channel setup-script pin blocks (splice/hoist/berth: hoist's, bosun: bosun's).
[pins]
splice = "0.25.0"
bosun = "0.25.0"
hoist = "0.25.0"
berth = "0.25.0"
# hull template tag (= commit 3f4a65fda568cdd20c76168ed156d25a28ba5630): keel renders `rust`/`ts` at it.
hull = "v0.13.0"

[refs.hull]
tag = "v0.13.0"
sha = "3f4a65fda568cdd20c76168ed156d25a28ba5630"
# The repo whose tag this is (hull tags up to v0.21.0 are in the old repo). Without `repo`, an
# entry means keelstackhq/hull.
repo = "keelstackhq/hull"

