[package]
name = "keelstack-cli"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Bootstrap a repo with the keelstackhq tools: one manifest, one command, one human step at a time"
license = "MIT"
repository = "https://github.com/keelstackhq/keelstack"
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[lib]
name = "keel"
path = "src/lib.rs"

[[bin]]
name = "keel"
path = "src/main.rs"

[dependencies]
base64.workspace = true
clap = { workspace = true, features = ["derive"] }
rpassword.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
