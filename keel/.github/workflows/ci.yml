name: ci

on:
  pull_request:
    # `ready_for_review`: a draft fails fast below, so it needs a full run once it is ready.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every `uses:` is a full commit SHA with a version comment; a tag or branch can move.
  check:
    runs-on: ubuntu-latest
    steps:
      # A draft fails fast (CI minutes): a step, not a job-level `if`, so ci-ok never sees a skip.
      - name: Fail on a draft
        shell: bash
        env:
          DRAFT: ${{ github.event.pull_request.draft || false }}
        run: |
          if [ "$DRAFT" = true ]; then echo "::error::draft: CI not run, mark ready for review"; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Launcher tests
        run: |
          if ls npm/keel/test/*.test.js >/dev/null 2>&1; then node --test npm/keel/test/*.test.js; fi

  # One stable required check for branch protection, the same name as in the other keelstackhq
  # repos: it fails unless every job above succeeded (also when one was skipped or cancelled).
  ci-ok:
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs succeeded
        run: |
          echo "check: ${{ needs.check.result }}"
          test "${{ needs.check.result }}" = "success"
