[package]
name = "keel-berth"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Give each parallel coding agent an isolated, ready workspace in a git repo"
license = "MIT"
repository = "https://github.com/keelstackhq/berth"
readme = "README.md"
keywords = ["git", "worktree", "ai-agents", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
# Only what builds the crate: no tests, fixtures, npm packages or docs in the .crate file.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[lib]
name = "berth"
path = "src/lib.rs"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta = { workspace = true, features = ["json", "filters"] }
predicates.workspace = true
tempfile.workspace = true
